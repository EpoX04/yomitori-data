# Wörterbuch monatlich neu bauen und als Release veröffentlichen (Yomitori#99).
# Die EDRDG-Lizenz verlangt, JMdict & Co. regelmäßig zu aktualisieren. Die App sieht täglich im
# neuesten Release nach (manifest.json → builtAt) und bietet das Update an.
# Modelle bleiben im Release, in dem sie liegen (`release` im Manifest).
name: Wörterbuch

on:
  schedule:
    - cron: '0 3 2 * *' # am 2. jedes Monats, 03:00 UTC
  workflow_dispatch:
    inputs:
      publish:
        description: 'Release veröffentlichen (aus: nur bauen und prüfen)'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: dictionary
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      ONNXRUNTIME_NODE_INSTALL: skip
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: data-repo
      - uses: actions/checkout@v4
        with:
          repository: EpoX04/Yomitori
          path: yomitori
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: yomitori/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Abhängigkeiten
        working-directory: yomitori
        run: pnpm install --frozen-lockfile --filter "@yomitori/dict..."
      - name: Quellen laden
        working-directory: yomitori
        run: pnpm dict:fetch
      - name: Wörterbuch bauen
        working-directory: yomitori
        run: |
          pnpm dict:build
          gzip -6 -c data/dict.sqlite > "$RUNNER_TEMP/dict.sqlite.gz"
      - name: Manifest
        working-directory: yomitori
        run: |
          tag="dict-$(date -u +%Y-%m-%d)"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          gh release download --repo "$GITHUB_REPOSITORY" --pattern manifest.json --output "$RUNNER_TEMP/previous.json"
          pnpm --filter @yomitori/dict release:manifest \
            --previous "$RUNNER_TEMP/previous.json" \
            --dict "$RUNNER_TEMP/dict.sqlite.gz" \
            --db "$GITHUB_WORKSPACE/yomitori/data/dict.sqlite" \
            --version "$tag" \
            --out "$RUNNER_TEMP/manifest.json"
          cat "$RUNNER_TEMP/manifest.json"
      - name: Release veröffentlichen
        if: github.event_name == 'schedule' || inputs.publish
        run: |
          jmdict=$(jq -r '.components[] | select(.id == "dictionary") | .jmdictCreated // "?"' "$RUNNER_TEMP/manifest.json")
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --latest \
            --title "Wörterbuch $TAG" \
            --notes "Monatlich neu gebautes Wörterbuch (JMdict-Stand $jmdict) aus den aktuellen Quellen; Lizenzen und Namensnennung: siehe README. Modelle unverändert (Release v1)." \
            "$RUNNER_TEMP/dict.sqlite.gz" "$RUNNER_TEMP/manifest.json"
          cp "$RUNNER_TEMP/manifest.json" data-repo/manifest.json
          cd data-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "Manifest für $TAG"
          git push
